version: "3.8"

services:
  # 1. ระบบจัดการฐานข้อมูลเชิงพื้นที่ [cite: 67, 71]
  db:
    image: postgis/postgis:15-3.3
    container_name: delivery-db
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=delivery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. ระบบประมวลผลหลัก (.NET 8) [cite: 27, 68]
  backend:
    build:
      context: ./BackendApi
      dockerfile: Dockerfile
    container_name: delivery-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=delivery_db;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=1024;
      - ConnectionStrings__Redis=redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - Jwt__Key=${JWT_SECRET}
      - Jwt__Issuer=DeliveryBackendApi
      - Jwt__Audience=DeliveryClients
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:80
      - Cors__AllowedOrigins__2=http://localhost:4200
      - Cors__AllowedOrigins__3=http://localhost:8080
      - Cors__AllowedOrigins__4=http://localhost:8081
      - Routing__LocalOsrmUrl=http://osrm:5000
      - Authentication__RequireSecureCookie=false
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Port=5672
      - MessageBroker__Username=${RABBITMQ_USER}
      - MessageBroker__Password=${RABBITMQ_PASSWORD}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5000:80"

  # 3. Redis — Realtime Speed Layer (GPS Cache, Distributed Lock, Rider Presence)
  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. ระบบปัญญาประดิษฐ์จัดเส้นทาง (Python FastAPI)
  ai-service:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: delivery-ai
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/delivery_db
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    # Ports removed to isolate the container from public access (OWASP LLM10 / LLM07 API Isolation)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 5. ระบบแดชบอร์ดแอดมิน (Angular)
  frontend:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: delivery-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 6. ระบบแอปพลิเคชันสำหรับไรเดอร์ (Flutter Web)
  rider-app:
    build:
      context: ./rider_app
      dockerfile: Dockerfile
    container_name: delivery-rider-app
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  # 7. ระบบคำนวณเส้นทางถนน Dijkstra (Offline OSRM Server)
  osrm:
    image: osrm/osrm-backend
    container_name: delivery-osrm
    user: root
    volumes:
      - ./osrm_data:/data
    command: osrm-routed --algorithm mld /data/udon-thani.osrm
    ports:
      - "5001:5000"
    restart: unless-stopped

  # 8. Nginx Reverse Proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: delivery-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # 9. Seq (Centralized Logging)
  seq:
    image: datalust/seq:latest
    container_name: delivery-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8082:80"
    volumes:
      - seq_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 10. Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: delivery-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # 11. Grafana (Dashboard)
  grafana:
    image: grafana/grafana-enterprise
    container_name: delivery-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  # 12. RabbitMQ Message Broker (Real-time Event Architecture)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: delivery-rabbitmq
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # Management Dashboard UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seq_data:
  grafana_data:
