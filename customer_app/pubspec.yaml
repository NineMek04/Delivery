name: customer_app
description: "AI-Optimized Smart Delivery Routing — Customer Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Networking ---
  dio: ^5.7.0
  signalr_netcore: ^1.4.4

  # --- State Management ---
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.8.1

  # --- Auth & Security ---
  flutter_secure_storage: ^9.2.4
  jwt_decoder: ^2.0.1

  # --- Location & Map ---
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- UI/UX ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # --- Utilities ---
  intl: ^0.20.2
  logger: ^2.5.0

  # --- Firebase / Push Notifications ---
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # --- Shared features ---
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
