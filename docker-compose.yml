version: "3.8"

services:
  # 1. ระบบจัดการฐานข้อมูลเชิงพื้นที่ [cite: 67, 71]
  db:
    image: postgis/postgis:15-3.3
    container_name: delivery-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Admin@Ts2x04_
      - POSTGRES_DB=delivery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. ระบบประมวลผลหลัก (.NET 8) [cite: 27, 68]
  backend:
    build:
      context: ./BackendApi
      dockerfile: Dockerfile
    container_name: delivery-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=delivery_db;Username=postgres;Password=Admin@Ts2x04_
      - ConnectionStrings__Redis=redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - Jwt__Key=DeliverySmartRoutingSystem_SuperSecretKey_2024
      - Jwt__Issuer=DeliveryBackendApi
      - Jwt__Audience=DeliveryClients
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:80
      - Cors__AllowedOrigins__2=http://localhost:4200
      - Authentication__RequireSecureCookie=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:80"

  # 3. Redis — Realtime Speed Layer (GPS Cache, Distributed Lock, Rider Presence)
  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. ระบบปัญญาประดิษฐ์จัดเส้นทาง (Python FastAPI)
  ai-service:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: delivery-ai
    environment:
      - DATABASE_URL=postgresql://postgres:Admin@Ts2x04_@db:5432/delivery_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 5. ระบบแดชบอร์ดแอดมิน (Angular)
  frontend:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: delivery-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

  # 6. ระบบแอปพลิเคชันสำหรับไรเดอร์ (Flutter Web)
  rider-app:
    build:
      context: ./rider_app
      dockerfile: Dockerfile
    container_name: delivery-rider-app
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
