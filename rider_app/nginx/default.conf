server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Force IPv4-only DNS — prevents nginx from preferring IPv6 for host.docker.internal
    # which would fail because .NET backend only listens on 127.0.0.1:5000 (IPv4).
    resolver 127.0.0.11 ipv4=on valid=30s;
    set $backend "http://host.docker.internal:5000";

    # Flutter Web SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API → Backend (.NET)
    location /api/ {
        proxy_pass $backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SignalR WebSocket — must use variable so nginx re-resolves each request
    location /hubs/ {
        proxy_pass $backend/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 10s;
    }
}


