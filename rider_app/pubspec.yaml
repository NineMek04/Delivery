name: rider_app
description: "AI-Optimized Smart Delivery Routing — Rider Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Networking ---
  dio: ^5.7.0
  signalr_netcore: ^1.4.4

  # --- State Management ---
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.8.1

  # --- Auth & Security ---
  flutter_secure_storage: ^9.2.4
  jwt_decoder: ^2.0.1

  # --- Location & Map ---
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- UI/UX ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # --- Utilities ---
  intl: ^0.20.2
  logger: ^2.5.0
  url_launcher: ^6.3.0

  # --- Local Database (SQLite — cross-platform, Web-safe with kIsWeb guard) ---
  sqflite: ^2.4.0
  path: ^1.9.0

  # --- Features (wrapped with kIsWeb / Platform guards in implementation) ---
  image_picker: ^1.1.2
  signature: ^5.4.1
  audioplayers: ^6.1.0
  vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
