proxy_cache_path /var/cache/nginx/map_tiles
    levels=1:2
    keys_zone=map_tiles:20m
    max_size=2g
    inactive=30d
    use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5M;

    # Proxy directly via container network
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend "http://backend:80";

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Flutter Web SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin map tiles avoid browser CORS/network policy differences.
    location ~ ^/map-tiles/(?<tile_path>.+)$ {
        set $tile_host "tile.openstreetmap.org";
        proxy_pass https://$tile_host/$tile_path;
        proxy_ssl_server_name on;
        proxy_ssl_name $tile_host;
        proxy_set_header Host $tile_host;
        proxy_set_header User-Agent "DeliveryRiderApp/1.0";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_cache map_tiles;
        proxy_cache_key "$tile_host/$tile_path";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Map-Tile-Cache $upstream_cache_status always;
    }

    # Proxy REST API → Backend (.NET)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SignalR WebSocket — must use variable so nginx re-resolves each request
    location /hubs/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 10s;
    }
}
