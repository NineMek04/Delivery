name: Delivery Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore BackendApi/BackendApi.csproj
    - name: Build
      run: dotnet build BackendApi/BackendApi.csproj --no-restore
    - name: Test
      run: dotnet test RootScripts/scripts.test/test/BackendApi.IntegrationTests/BackendApi.IntegrationTests.csproj --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: ./admin-dashboard
      run: npm ci
    - name: Build
      working-directory: ./admin-dashboard
      run: npm run build

  ai-engine:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./ai-engine
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      working-directory: ./ai-engine
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      working-directory: ./ai-engine
      run: |
        python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-engine]
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker images
      run: |
        docker compose -f docker-compose.yml build
