name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server Public Base URL (e.g. Cloudflare Tunnel, leave empty to configure in app)'
        required: false
        default: ''
      build_android:
        description: 'Build Android Release APK'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS Release App (Unsigned IPA)'
        type: boolean
        default: true

  push:
    branches:
      - Development
      - main
      - master
    paths:
      - 'rider_app/**'
      - '.github/workflows/build-mobile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Android APK Build (Ubuntu Runner)
  # =========================================================================
  build-android:
    name: 🤖 Android APK
    if: ${{ github.event_name == 'push' || inputs.build_android == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./rider_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./rider_app
        run: |
          API_FLAG=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            API_FLAG="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          flutter build apk --release --android-skip-build-dependency-validation $API_FLAG

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-android-apk
          path: ./rider_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Append Job Summary (Android)
        run: |
          echo "### 🤖 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Ready to install on Android devices" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # 2. iOS Build (macOS Runner)
  # =========================================================================
  build-ios:
    name: 🍎 iOS App (Unsigned IPA)
    if: ${{ github.event_name == 'push' || inputs.build_ios == true }}
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Flutter Dependencies
        working-directory: ./rider_app
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ./rider_app/ios
        run: pod install --repo-update

      - name: Build iOS App
        working-directory: ./rider_app
        run: |
          API_FLAG=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            API_FLAG="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          flutter build ios --release --no-codesign $API_FLAG

      - name: Package Unsigned IPA and App Zip
        working-directory: ./rider_app
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          # Create IPA
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../dist/Delivery-iOS-unsigned.ipa Payload
          # Create Runner.app.zip for Simulator/Mac
          zip -r ../../../dist/Runner-iOS.app.zip Runner.app
          cd ../../..

      - name: Upload iOS IPA & App
        uses: actions/upload-artifact@v4
        with:
          name: delivery-ios-app
          path: ./rider_app/dist/*
          retention-days: 14

      - name: Append Job Summary (iOS)
        run: |
          echo "### 🍎 iOS Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Files**: \`Delivery-iOS-unsigned.ipa\`, \`Runner-iOS.app.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Ready for Sideloading (AltStore, Sideloadly, TrollStore) or Xcode Signing" >> $GITHUB_STEP_SUMMARY
