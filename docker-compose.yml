version: "3.8"

services:
  # 1. ระบบจัดการฐานข้อมูลเชิงพื้นที่ [cite: 67, 71]
  db:
    image: postgis/postgis:15-3.3
    container_name: delivery-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Admin@Ts2x04_
      - POSTGRES_DB=delivery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. ระบบประมวลผลหลัก (.NET 8) [cite: 27, 68]
  backend:
    build:
      context: ./BackendApi
      dockerfile: Dockerfile
    container_name: delivery-backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=delivery_db;Username=postgres;Password=password123
      - AI_SERVICE_URL=http://ai-service:8000
      - Jwt__Key=replace-with-a-long-random-key-that-is-at-least-32-characters
      - Jwt__Issuer=DeliveryBackendApi
      - Jwt__Audience=DeliveryClients
      - Cors__AllowedOrigins=http://localhost,http://localhost:4200
      - Authentication__RequireSecureCookie=false
    depends_on:
      - db
      - redis
    ports:
      - "5000:80"

  # 3. Redis — Realtime Speed Layer (GPS Cache, Distributed Lock, Rider Presence)
  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 4. ระบบปัญญาประดิษฐ์จัดเส้นทาง (Python FastAPI)
  ai-service:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: delivery-ai
    depends_on:
      - db
    ports:
      - "8000:8000"

  # 5. ระบบแดชบอร์ดแอดมิน (Angular)
  frontend:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: delivery-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
