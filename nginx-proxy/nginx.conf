events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 50M;

    # 1. Rate Limiting Setup
    # จำกัด Requests ต่อ IP ที่ 200 request/sec (รองรับ Load Test 100+ RPS จาก IP เดียว)
    # Production จริง: ปรับลดลงหรือ Whitelist IP ของ Load Balancer
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

    upstream backend {
        server backend:80;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;
        
        # 2. Security Headers (OWASP Hardening)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /api {
            # ใช้ Rate Limiting ป้องกันสแปมฝั่ง API (burst=100 รองรับ Load Test)
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /hubs {
            # ใช้ Rate Limiting ป้องกันพิกัดจำลองถล่มการต่อ Socket (burst=100)
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /metrics {
            # 3. Basic Authentication สำหรับปิดกั้นการเข้าถึงระบบภายนอก
            auth_basic "Restricted Metrics Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
